<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Control de Finanzas</title>

  <!-- Configuración iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F9FAFB">

  <!-- Tailwind CSS & Iconos Lucide -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      padding-top: calc(env(safe-area-inset-top, 20px) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, button { user-select: auto; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col items-center">

  <div class="w-full max-w-md px-5 flex flex-col flex-1 pb-10">
    
    <!-- Patrimonio Total y Acciones -->
    <header class="flex justify-between items-center py-4">
      <div>
        <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Patrimonio Total</p>
        <h1 id="total-net-worth" class="text-3xl font-extrabold tracking-tight text-gray-900 mt-0.5">0,00 €</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportData()" title="Copia de seguridad" class="p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full active:scale-95 transition-transform">
          <i data-lucide="download" class="w-5 h-5"></i>
        </button>
        <button onclick="openModal()" class="p-2.5 bg-black text-white rounded-full active:scale-95 transition-transform shadow-md">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- Tarjetas de Cuentas (Gasto / Ahorro) -->
    <section class="grid grid-cols-2 gap-3 my-3">
      
      <!-- Cuenta Gasto -->
      <div onclick="setAccountFilter('gasto')" id="card-gasto" class="bg-white p-4 rounded-2xl border-2 border-gray-900 shadow-sm flex flex-col justify-between cursor-pointer transition-all active:scale-95">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2 text-gray-800">
            <span class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="credit-card" class="w-4 h-4"></i></span>
            <span class="text-xs font-semibold">Gastos</span>
          </div>
        </div>
        <div>
          <p id="balance-gasto" class="text-lg font-bold text-gray-900 mt-3">0,00 €</p>
          <p class="text-[10px] text-gray-400 mt-0.5">Cuenta diaria</p>
        </div>
      </div>

      <!-- Cuenta Ahorro -->
      <div onclick="setAccountFilter('ahorro')" id="card-ahorro" class="bg-white p-4 rounded-2xl border-2 border-transparent shadow-sm flex flex-col justify-between cursor-pointer transition-all active:scale-95">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2 text-emerald-600">
            <span class="p-1.5 bg-emerald-50 rounded-lg"><i data-lucide="piggy-bank" class="w-4 h-4"></i></span>
            <span class="text-xs font-semibold">Ahorro</span>
          </div>
        </div>
        <div>
          <p id="balance-ahorro" class="text-lg font-bold text-emerald-600 mt-3">0,00 €</p>
          <p class="text-[10px] text-gray-400 mt-0.5">Fondo reservado</p>
        </div>
      </div>

    </section>

    <!-- Filtros de Pestaña -->
    <div class="flex bg-gray-200/70 p-1 rounded-xl my-2 text-xs font-semibold">
      <button onclick="setAccountFilter('all')" id="tab-all" class="flex-1 py-1.5 rounded-lg text-gray-600 transition-all">Todos</button>
      <button onclick="setAccountFilter('gasto')" id="tab-gasto" class="flex-1 py-1.5 rounded-lg bg-white text-gray-900 shadow-sm transition-all">Cta. Gasto</button>
      <button onclick="setAccountFilter('ahorro')" id="tab-ahorro" class="flex-1 py-1.5 rounded-lg text-gray-600 transition-all">Cta. Ahorro</button>
    </div>

    <!-- Lista de Transacciones -->
    <section class="flex-1 mt-3">
      <div class="flex justify-between items-center mb-3">
        <h2 id="list-title" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Movimientos: Gasto</h2>
        <span id="items-count" class="text-xs text-gray-400">0 registros</span>
      </div>

      <div id="transactions-list" class="space-y-2.5"></div>
      
      <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center">
        <div class="p-4 bg-gray-100 rounded-full text-gray-400 mb-3">
          <i data-lucide="receipt" class="w-7 h-7"></i>
        </div>
        <p class="text-sm font-medium text-gray-500">Sin movimientos registrados</p>
        <p class="text-xs text-gray-400 mt-1">Pulsa (+) para añadir un movimiento a esta cuenta.</p>
      </div>
    </section>

  </div>

  <!-- Formulario Modal -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-200">
      
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-900">Registrar Movimiento</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="transaction-form" onsubmit="saveTransaction(event)" class="space-y-4">
        
        <!-- Selector de Cuenta -->
        <div>
          <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Cuenta Destino</label>
          <div class="flex bg-gray-100 p-1 rounded-xl">
            <label class="flex-1 text-center cursor-pointer">
              <input type="radio" name="account" value="gasto" class="hidden peer" checked onchange="updateFormUI()">
              <span class="block py-2 text-xs font-semibold text-gray-500 rounded-lg peer-checked:bg-white peer-checked:text-gray-900 peer-checked:shadow-sm transition-all">💳 Cuenta Gasto</span>
            </label>
            <label class="flex-1 text-center cursor-pointer">
              <input type="radio" name="account" value="ahorro" class="hidden peer" onchange="updateFormUI()">
              <span class="block py-2 text-xs font-semibold text-gray-500 rounded-lg peer-checked:bg-white peer-checked:text-emerald-600 peer-checked:shadow-sm transition-all">🐖 Cuenta Ahorro</span>
            </label>
          </div>
        </div>

        <!-- Tipo de Registro -->
        <div>
          <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Tipo</label>
          <div class="flex bg-gray-100 p-1 rounded-xl">
            <label class="flex-1 text-center cursor-pointer">
              <input type="radio" name="type" value="income" class="hidden peer" checked onchange="updateCategories()">
              <span id="label-income" class="block py-2 text-xs font-semibold text-gray-500 rounded-lg peer-checked:bg-white peer-checked:text-emerald-600 peer-checked:shadow-sm transition-all">Ingreso / Nómina</span>
            </label>
            <label class="flex-1 text-center cursor-pointer">
              <input type="radio" name="type" value="expense" class="hidden peer" onchange="updateCategories()">
              <span id="label-expense" class="block py-2 text-xs font-semibold text-gray-500 rounded-lg peer-checked:bg-white peer-checked:text-rose-600 peer-checked:shadow-sm transition-all">Gasto</span>
            </label>
          </div>
        </div>

        <!-- Importe -->
        <div>
          <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Importe (€)</label>
          <input type="number" step="0.01" min="0.01" id="amount" required placeholder="0.00" class="w-full text-2xl font-extrabold bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <!-- Concepto -->
        <div>
          <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Concepto</label>
          <input type="text" id="concept" required placeholder="Ej. Nómina, Supermercado, Aporte ahorro..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <!-- Categoría -->
        <div>
          <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Categoría</label>
          <select id="category" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-black"></select>
        </div>

        <button type="submit" class="w-full bg-black text-white font-semibold py-3.5 rounded-xl active:scale-[0.98] transition-transform mt-3 text-sm">
          Guardar Movimiento
        </button>
      </form>

    </div>
  </div>

  <script>
    const categoryOptions = {
      gasto: {
        income: ['Nómina / Salario', 'Freelance / Extras', 'Bizum / Devolución', 'Otros ingresos'],
        expense: ['Vivienda / Alquiler', 'Supermercado', 'Restaurantes y Ocio', 'Transporte', 'Facturas / Luz / Agua', 'Salud', 'Compras', 'Otros']
      },
      ahorro: {
        income: ['Aporte mensual', 'Traspaso desde Gasto', 'Intereses / Rendimiento', 'Fondo de Emergencia', 'Meta de Ahorro'],
        expense: ['Retirada Imprevisto', 'Uso para Meta', 'Inversión Externa', 'Otros']
      }
    };

    let transactions = JSON.parse(localStorage.getItem('my_finances_data_v2')) || [];
    let activeFilter = 'gasto';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateFormUI();
      render();
    });

    const formatCurrency = (amount) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(amount);

    function setAccountFilter(account) {
      activeFilter = account;

      const tabs = { all: 'tab-all', gasto: 'tab-gasto', ahorro: 'tab-ahorro' };
      Object.keys(tabs).forEach(key => {
        const el = document.getElementById(tabs[key]);
        el.className = key === account
          ? "flex-1 py-1.5 rounded-lg bg-white text-gray-900 shadow-sm transition-all"
          : "flex-1 py-1.5 rounded-lg text-gray-600 transition-all";
      });

      document.getElementById('card-gasto').className = `bg-white p-4 rounded-2xl border-2 ${account === 'gasto' ? 'border-gray-900' : 'border-transparent'} shadow-sm flex flex-col justify-between cursor-pointer transition-all active:scale-95`;
      document.getElementById('card-ahorro').className = `bg-white p-4 rounded-2xl border-2 ${account === 'ahorro' ? 'border-emerald-600' : 'border-transparent'} shadow-sm flex flex-col justify-between cursor-pointer transition-all active:scale-95`;

      render();
    }

    function updateFormUI() {
      const account = document.querySelector('input[name="account"]:checked').value;
      const labelIncome = document.getElementById('label-income');
      const labelExpense = document.getElementById('label-expense');

      if (account === 'ahorro') {
        labelIncome.textContent = '+ Añadir Ahorro';
        labelExpense.textContent = '- Retirar Ahorro';
      } else {
        labelIncome.textContent = 'Ingreso / Nómina';
        labelExpense.textContent = 'Gasto';
      }

      updateCategories();
    }

    function updateCategories() {
      const account = document.querySelector('input[name="account"]:checked').value;
      const type = document.querySelector('input[name="type"]:checked').value;
      const select = document.getElementById('category');
      select.innerHTML = '';

      const list = categoryOptions[account][type] || [];
      list.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function render() {
      const list = document.getElementById('transactions-list');
      const emptyState = document.getElementById('empty-state');
      const countLabel = document.getElementById('items-count');
      const listTitle = document.getElementById('list-title');
      list.innerHTML = '';

      let balanceGasto = 0;
      let balanceAhorro = 0;

      transactions.forEach(t => {
        const amount = parseFloat(t.amount);
        if (t.account === 'ahorro') {
          balanceAhorro += (t.type === 'income' ? amount : -amount);
        } else {
          balanceGasto += (t.type === 'income' ? amount : -amount);
        }
      });

      document.getElementById('balance-gasto').textContent = formatCurrency(balanceGasto);
      document.getElementById('balance-ahorro').textContent = formatCurrency(balanceAhorro);
      document.getElementById('total-net-worth').textContent = formatCurrency(balanceGasto + balanceAhorro);

      const filtered = transactions.filter(t => activeFilter === 'all' || (t.account || 'gasto') === activeFilter);

      listTitle.textContent = activeFilter === 'all' ? 'Todos los movimientos' : (activeFilter === 'ahorro' ? 'Movimientos: Ahorro' : 'Movimientos: Gasto');
      countLabel.textContent = `${filtered.length} registros`;

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach(item => {
        const originalIndex = transactions.indexOf(item);
        const isIncome = item.type === 'income';
        const isAhorro = item.account === 'ahorro';
        
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="p-2.5 rounded-xl ${isAhorro ? 'bg-emerald-50 text-emerald-600' : (isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-gray-100 text-gray-700')}">
              <i data-lucide="${isAhorro ? 'piggy-bank' : (isIncome ? 'wallet' : 'shopping-bag')}" class="w-4 h-4"></i>
            </div>
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded ${isAhorro ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-600'}">
                  ${isAhorro ? 'Ahorro' : 'Gasto'}
                </span>
                <p class="text-sm font-semibold text-gray-900">${item.concept}</p>
              </div>
              <p class="text-xs text-gray-400 mt-0.5">${item.category} • ${item.date}</p>
            </div>
          </div>
          <div class="flex items-center space-x-3">
            <span class="text-sm font-bold ${isIncome ? 'text-emerald-600' : 'text-gray-900'}">
              ${isIncome ? '+' : '-'}${formatCurrency(item.amount)}
            </span>
            <button onclick="deleteTransaction(${originalIndex})" class="text-gray-300 hover:text-rose-500 p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        list.appendChild(card);
      });

      lucide.createIcons();
    }

    function saveTransaction(e) {
      e.preventDefault();
      const account = document.querySelector('input[name="account"]:checked').value;
      const type = document.querySelector('input[name="type"]:checked').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const concept = document.getElementById('concept').value.trim();
      const category = document.getElementById('category').value;
      
      const now = new Date();
      const date = now.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });

      transactions.unshift({ account, type, amount, concept, category, date, timestamp: now.getTime() });
      localStorage.setItem('my_finances_data_v2', JSON.stringify(transactions));

      document.getElementById('transaction-form').reset();
      updateFormUI();
      closeModal();
      setAccountFilter(account);
    }

    function deleteTransaction(index) {
      if (confirm("¿Deseas eliminar este movimiento?")) {
        transactions.splice(index, 1);
        localStorage.setItem('my_finances_data_v2', JSON.stringify(transactions));
        render();
      }
    }

    function exportData() {
      if (transactions.length === 0) {
        alert("Aún no tienes registros guardados.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `finanzas_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    const modal = document.getElementById('modal');
    const modalContent = modal.querySelector('div');

    function openModal() {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContent.classList.remove('translate-y-full');
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      modalContent.classList.add('translate-y-full');
      setTimeout(() => { modal.classList.add('hidden'); }, 200);
    }
  </script>
</body>
</html>
