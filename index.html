<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Control de Finanzas</title>

  <!-- Configuración iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F9FAFB">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      padding-top: calc(env(safe-area-inset-top, 20px) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, button { user-select: auto; }
    /* Scrollbar personalizada minimalista */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col items-center">

  <div class="w-full max-w-md px-5 flex flex-col flex-1 pb-10">
    
    <!-- Encabezado Superior -->
    <header class="flex justify-between items-center py-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Balance Total</p>
        <h1 id="total-balance" class="text-3xl font-extrabold tracking-tight text-gray-900 mt-0.5">0,00 €</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportData()" title="Copia de seguridad" class="p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full active:scale-95 transition-transform">
          <i data-lucide="download" class="w-5 h-5"></i>
        </button>
        <button onclick="openModal()" class="p-2.5 bg-gray-900 hover:bg-black text-white rounded-full active:scale-95 transition-transform shadow-md">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- Tarjetas de Resumen (Ingresos y Gastos) -->
    <section class="grid grid-cols-2 gap-3 my-3">
      <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between">
        <div class="flex items-center space-x-2 text-emerald-600">
          <span class="p-1.5 bg-emerald-50 rounded-lg"><i data-lucide="arrow-down-left" class="w-4 h-4"></i></span>
          <span class="text-xs font-medium text-gray-500">Ingresos</span>
        </div>
        <p id="total-income" class="text-lg font-bold text-gray-900 mt-2">+0,00 €</p>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between">
        <div class="flex items-center space-x-2 text-rose-500">
          <span class="p-1.5 bg-rose-50 rounded-lg"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></span>
          <span class="text-xs font-medium text-gray-500">Gastos</span>
        </div>
        <p id="total-expenses" class="text-lg font-bold text-gray-900 mt-2">-0,00 €</p>
      </div>
    </section>

    <!-- Filtro de Categoría Rápido -->
    <div class="flex items-center space-x-2 my-2 overflow-x-auto py-1 no-scrollbar text-xs">
      <button onclick="filterTransactions('all')" class="filter-btn active px-3 py-1.5 rounded-full font-medium bg-gray-900 text-white transition-all">Todos</button>
      <button onclick="filterTransactions('income')" class="filter-btn px-3 py-1.5 rounded-full font-medium bg-gray-100 text-gray-600 transition-all">Ingresos</button>
      <button onclick="filterTransactions('expense')" class="filter-btn px-3 py-1.5 rounded-full font-medium bg-gray-100 text-gray-600 transition-all">Gastos</button>
    </div>

    <!-- Lista de Movimientos -->
    <section class="flex-1 mt-2">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Movimientos</h2>
        <span id="items-count" class="text-xs text-gray-400">0 registros</span>
      </div>

      <div id="transactions-list" class="space-y-2.5">
        <!-- Render dinámico -->
      </div>
      
      <!-- Estado Vacío -->
      <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center">
        <div class="p-4 bg-gray-100 rounded-full text-gray-400 mb-3">
          <i data-lucide="receipt" class="w-8 h-8"></i>
        </div>
        <p class="text-sm font-medium text-gray-500">No hay movimientos registrados</p>
        <p class="text-xs text-gray-400 mt-1">Toca el botón (+) superior para registrar tu salario o un gasto.</p>
      </div>
    </section>

  </div>

  <!-- Modal / Formulario Flotante -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-200">
      
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-lg font-bold text-gray-900">Nuevo Movimiento</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="transaction-form" onsubmit="saveTransaction(event)" class="space-y-4">
        <!-- Tipo de Transacción -->
        <div class="flex bg-gray-100 p-1 rounded-xl">
          <label class="flex-1 text-center cursor-pointer">
            <input type="radio" name="type" value="income" class="hidden peer" onchange="updateCategories()">
            <span class="block py-2 text-sm font-medium text-gray-500 rounded-lg peer-checked:bg-white peer-checked:text-emerald-600 peer-checked:shadow-sm transition-all">Ingreso / Salario</span>
          </label>
          <label class="flex-1 text-center cursor-pointer">
            <input type="radio" name="type" value="expense" class="hidden peer" checked onchange="updateCategories()">
            <span class="block py-2 text-sm font-medium text-gray-500 rounded-lg peer-checked:bg-white peer-checked:text-rose-600 peer-checked:shadow-sm transition-all">Gasto</span>
          </label>
        </div>

        <!-- Importe -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Importe (€)</label>
          <input type="number" step="0.01" min="0.01" id="amount" required placeholder="0.00" class="w-full text-2xl font-bold bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <!-- Concepto -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Concepto</label>
          <input type="text" id="concept" required placeholder="Ej. Nómina mensual, Supermercado..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <!-- Categoría -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Categoría</label>
          <select id="category" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black">
          </select>
        </div>

        <!-- Botón Guardar -->
        <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-medium py-3.5 rounded-xl active:scale-[0.98] transition-transform mt-4">
          Guardar Movimiento
        </button>
      </form>

    </div>
  </div>

  <script>
    const categories = {
      income: ['Nómina / Salario', 'Honorarios / Freelance', 'Inversiones', 'Venta 2ª Mano', 'Otros ingresos'],
      expense: ['Vivienda / Alquiler', 'Supermercado', 'Transporte', 'Restaurantes y Ocio', 'Servicios y Facturas', 'Salud y Farmacia', 'Compras', 'Otros']
    };

    let transactions = JSON.parse(localStorage.getItem('my_finances_data')) || [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateCategories();
      render();
    });

    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(amount);
    };

    function updateCategories() {
      const type = document.querySelector('input[name="type"]:checked').value;
      const select = document.getElementById('category');
      select.innerHTML = '';
      categories[type].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function filterTransactions(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-gray-900', 'text-white');
        btn.classList.add('bg-gray-100', 'text-gray-600');
      });
      event.target.classList.remove('bg-gray-100', 'text-gray-600');
      event.target.classList.add('bg-gray-900', 'text-white');
      render();
    }

    function render() {
      const list = document.getElementById('transactions-list');
      const emptyState = document.getElementById('empty-state');
      const countLabel = document.getElementById('items-count');
      list.innerHTML = '';

      let income = 0;
      let expenses = 0;

      transactions.forEach(item => {
        if (item.type === 'income') income += item.amount;
        if (item.type === 'expense') expenses += item.amount;
      });

      const filtered = transactions.filter(t => currentFilter === 'all' || t.type === currentFilter);

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach((item) => {
        const originalIndex = transactions.indexOf(item);
        const isIncome = item.type === 'income';
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="p-2.5 rounded-xl ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-gray-100 text-gray-700'}">
              <i data-lucide="${isIncome ? 'wallet' : 'shopping-bag'}" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="text-sm font-semibold text-gray-900">${item.concept}</p>
              <p class="text-xs text-gray-400">${item.category} • ${item.date}</p>
            </div>
          </div>
          <div class="flex items-center space-x-3">
            <span class="text-sm font-bold ${isIncome ? 'text-emerald-600' : 'text-gray-900'}">
              ${isIncome ? '+' : '-'}${formatCurrency(item.amount)}
            </span>
            <button onclick="deleteTransaction(${originalIndex})" class="text-gray-300 hover:text-rose-500 p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        list.appendChild(card);
      });

      const balance = income - expenses;
      document.getElementById('total-balance').textContent = formatCurrency(balance);
      document.getElementById('total-income').textContent = '+' + formatCurrency(income);
      document.getElementById('total-expenses').textContent = '-' + formatCurrency(expenses);
      countLabel.textContent = `${filtered.length} de ${transactions.length} movimientos`;

      lucide.createIcons();
    }

    function saveTransaction(e) {
      e.preventDefault();
      const type = document.querySelector('input[name="type"]:checked').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const concept = document.getElementById('concept').value.trim();
      const category = document.getElementById('category').value;
      
      const now = new Date();
      const date = now.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });

      transactions.unshift({ type, amount, concept, category, date, timestamp: now.getTime() });
      localStorage.setItem('my_finances_data', JSON.stringify(transactions));

      document.getElementById('transaction-form').reset();
      updateCategories();
      closeModal();
      render();
    }

    function deleteTransaction(index) {
      if (confirm("¿Deseas eliminar este registro?")) {
        transactions.splice(index, 1);
        localStorage.setItem('my_finances_data', JSON.stringify(transactions));
        render();
      }
    }

    function exportData() {
      if (transactions.length === 0) {
        alert("Aún no tienes registros guardados.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `finanzas_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Modal UI Logic
    const modal = document.getElementById('modal');
    const modalContent = modal.querySelector('div');

    function openModal() {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContent.classList.remove('translate-y-full');
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      modalContent.classList.add('translate-y-full');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }
  </script>
</body>
</html>
